# Stack de produção para o Portainer (ADR-10). Imagens publicadas pelo CI
# (M0.5) em docker.io/wallacestm/aniweek-{api,web}. Todas as variáveis abaixo
# são configuradas como Environment variables do stack no Portainer — nada
# aqui é secreto nem versionado com valor real.
services:
  rt-aniweek-api:
    image: wallacestm/aniweek-api:latest
    container_name: rt-aniweek-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: ${DATABASE_URL}

      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}

      JWT_AUX_SECRET: ${JWT_AUX_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN_DAYS: ${JWT_REFRESH_EXPIRES_IN_DAYS}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}

      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
    ports:
      - '${API_PORT:-3000}:3000'
    networks:
     - rt-network

  rt-aniweek:
    image: wallacestm/aniweek-web:latest
    container_name: rt-aniweek
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    environment:
      VITE_API_URL: ${VITE_API_URL} 
    depends_on:
      - api
    networks:
      - rt-network


networks:
  rt-network:
    external: true