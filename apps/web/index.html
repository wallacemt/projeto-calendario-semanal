<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AnimeWeek — organize seus animes por dia da semana</title>
    <meta
      name="description"
      content="Monte seu calendário semanal de animes, acompanhe o progresso dos episódios e organize suas temporadas — tudo num só lugar."
    />
    <meta name="theme-color" content="#05060b" />

    <!-- SPA sem SSR por rota: só a home (/) tem canonical correto hoje.
         Demais rotas públicas herdam este mesmo <head> — ver auditoria SEO,
         Fase 2 (SSR/prerender) antes de generalizar isso por rota. -->
    <link rel="canonical" href="https://aniweek.wallacedev.com.br/" />

    <!-- Favicons (ver public/) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / redes sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AnimeWeek" />
    <meta property="og:title" content="AnimeWeek — organize seus animes por dia da semana" />
    <meta
      property="og:description"
      content="Monte seu calendário semanal de animes, acompanhe o progresso dos episódios e organize suas temporadas — tudo num só lugar."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://aniweek.wallacedev.com.br/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AnimeWeek — organize seus animes por dia da semana" />
    <meta
      name="twitter:description"
      content="Monte seu calendário semanal de animes, acompanhe o progresso dos episódios e organize suas temporadas — tudo num só lugar."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- VITE_ROBOTS_CONTENT vem do .env do ambiente de build (ver .env.example)
         — "noindex, nofollow" em dev/staging, "index, follow" só no build de
         produção. Antes era uma string fixa aqui: fácil de esquecer de tirar
         no deploy de lançamento (achado da auditoria SEO). -->
    <meta name="robots" content="%VITE_ROBOTS_CONTENT%" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
