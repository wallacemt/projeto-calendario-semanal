server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Assets do build do Vite (JS/CSS/imagens/fontes) têm hash no nome
  # (ex.: icon-a1b2c3.png) — conteúdo novo sempre vira um arquivo novo, então
  # é seguro cachear "para sempre" (immutable) em vez de revalidar a cada
  # load, que é o que fazia o logo/ícones recarregarem devagar antes.
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|avif|ico|woff2?|ttf)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html nunca pode ser cacheado por muito tempo — é ele que referencia
  # o nome hasheado do bundle atual; cachear ele "para sempre" faria o
  # browser nunca buscar um deploy novo.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
