name: CI

on:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Bun não roda o postinstall (prisma generate) de dependências por
      # padrão sem `trustedDependencies` — sem isso, apps/api/generated/prisma
      # (gitignored) não existe e todo campo tipado por Prisma vira `any` pro
      # ESLint typed, derrubando o Lint em quase todo módulo.
      - name: Generate Prisma Client
        run: bun run --filter api db:generate

      # @aniweek/shared resolve via dist/ (package.json#exports), que é
      # gitignored — sem essa build, api/web importam um pacote inexistente e
      # todo tipo vindo de lá vira `error` pro TS, cascateando em "cannot be
      # resolved" no ESLint typed em qualquer arquivo que use os schemas Zod
      # compartilhados.
      - name: Build shared package
        run: bun run --filter @aniweek/shared build

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
